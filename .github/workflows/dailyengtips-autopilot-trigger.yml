name: DailyEngTips AutoPilot Trigger

on:
  # 2026-09: 아래 curl 주소가 없어져(DEPLOYMENT_NOT_FOUND) 발행이 한 번도 되지 않아 예약 실행을 중지했다.
  # 실제 관리 앱은 auto-blog-by-google-ai-3.vercel.app에 있다. 발행을 재개하려면 주소를 바꾸고 schedule을 되살린다.
  # schedule:
  #   - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:      # Allow manual trigger

jobs:
  trigger-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AutoPilot API
        run: |
          curl -X POST "https://dailyengtips-admin.vercel.app/api/cron/auto-pilot" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"

