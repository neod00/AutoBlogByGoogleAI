name: Climate Insight Auto Blog Publish

on:
  repository_dispatch:
    types: [publish_post]

concurrency:
  group: climate-insight-auto-publish
  cancel-in-progress: false

env:
  LANG: ko_KR.UTF-8
  LC_ALL: C.UTF-8
  PYTHONIOENCODING: utf-8

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager python-dotenv

      - name: Install Chrome dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxss1 libasound2t64 libatk-bridge2.0-0t64 libgtk-3-0 libgbm1 libdrm2 xvfb

      - name: Restore Tistory cookies
        run: |
          mkdir -p ~/.tistory_login/cookies
          echo "${{ secrets.TISTORY_COOKIES_B64 }}" | base64 -d > ~/.tistory_login/cookies/default_cookies.pkl

      - name: Generate blog content
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_TOPIC: ${{ github.event.client_payload.topic }}
          PUBLISH_TEMPLATE: ${{ github.event.client_payload.template || 'review' }}
        run: |
          echo "Generating Climate Insight blog post for: $PUBLISH_TOPIC"
          npx tsx scripts/generate-content.ts "$PUBLISH_TOPIC" "$PUBLISH_TEMPLATE" > /tmp/blog_output.json
          cat /tmp/blog_output.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Title: {d.get(\"title\",\"?\")[:60]}')"

      - name: Quality gate
        env:
          PUBLISH_TOPIC: ${{ github.event.client_payload.topic }}
        run: |
          if ! python scripts/quality_gate.py \
            --content-file /tmp/blog_output.json \
            --topic "$PUBLISH_TOPIC"; then
            python3 - <<'PY'
          import json

          with open("/tmp/blog_output.json", "r", encoding="utf-8") as f:
              blog = json.load(f)

          try:
              with open("/tmp/quality_gate_result.json", "r", encoding="utf-8") as f:
                  qg = json.load(f)
              failed = [
                  f"{d.get('name')}: {d.get('detail')}"
                  for d in qg.get("details", [])
                  if d.get("icon") == "❌"
              ]
              error = "Quality gate failed" + (": " + " | ".join(failed[:3]) if failed else "")
          except Exception:
              error = "Quality gate failed"

          with open("/tmp/publish_result.json", "w", encoding="utf-8") as f:
              json.dump({
                  "success": False,
                  "url": "",
                  "error": error,
                  "title": blog.get("title", "Unknown"),
                  "category": blog.get("category", "Unknown"),
              }, f, ensure_ascii=False, indent=2)
          PY
            exit 1
          fi

      - name: Publish to Tistory
        id: publish
        env:
          TISTORY_BLOG_URL: https://climate-insight.tistory.com
          TISTORY_KAKAO_ID: ${{ secrets.TISTORY_KAKAO_ID }}
          TISTORY_KAKAO_PW: ${{ secrets.TISTORY_KAKAO_PW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          xvfb-run --auto-servernum python scripts/publish-to-tistory.py \
            --content-file /tmp/blog_output.json \
            --blog-url "$TISTORY_BLOG_URL" \
            --categories "카테고리 없음,ai 신기술 및 이슈,기후변화 이슈,정책과 제도,기후금융,국제협력,과학과 기술,탄소중립,기타"

      - name: Show Chromedriver logs
        if: failure()
        run: cat /tmp/chromedriver.log || echo "No chromedriver log found"

      - name: Report cookie status
        if: always()
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_URL: ${{ github.event.client_payload.app_url || 'https://auto-blog-by-google-ai.vercel.app' }}
        run: |
          if [ -f /tmp/publish_result.json ]; then
            ERROR=$(python3 -c "import json; r=json.load(open('/tmp/publish_result.json')); print(r.get('error',''))")
            SUCCESS=$(python3 -c "import json; r=json.load(open('/tmp/publish_result.json')); print(r.get('success', False))")

            if [ "$SUCCESS" = "True" ]; then
              STATUS="valid"
              ERROR_MSG=""
            elif echo "$ERROR" | grep -qiE "로그인|login|cookie|쿠키|로딩 실패|redirect|인증|카카오"; then
              STATUS="expired"
              ERROR_MSG="$ERROR"
            else
              STATUS="valid"
              ERROR_MSG=""
            fi
          else
            STATUS="unknown"
            ERROR_MSG="publish_result.json not found"
          fi

          # app_url이 스킴 없이(또는 http://로) 전달돼도 항상 https로 강제한다.
          # 308 리다이렉트를 만나면 curl이 Authorization 헤더를 포트 변경으로 보고 탈락시킬 수 있어
          # -L만으로는 불충분하다 — 애초에 https 요청을 만드는 편이 안전하다.
          APP_URL="https://$(echo "$APP_URL" | sed -E 's#^https?://##; s#/+$##')"
          echo "Reporting cookie status: $STATUS"
          # -L/--retry: 그래도 리다이렉트나 일시적 네트워크/5xx 오류가 발생하면 대비한다.
          HTTP_CODE=$(curl -sS -L -o /tmp/cookie_status_resp.json -w "%{http_code}" \
            --retry 3 --retry-delay 3 --retry-all-errors \
            -X POST "$APP_URL/api/admin/cookie-status" \
            -H "Authorization: Bearer $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"error\": \"$ERROR_MSG\"}") || HTTP_CODE="000"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Cookie status reported (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Warning: Failed to report cookie status (HTTP $HTTP_CODE)"
            cat /tmp/cookie_status_resp.json 2>/dev/null || true
          fi

      - name: Send notification email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ github.event.client_payload.recipientEmail || secrets.GMAIL_USER }}
        run: |
          npx tsx scripts/send-result-email.ts

      - name: Update topic status
        if: always()
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_URL: ${{ github.event.client_payload.app_url || 'https://auto-blog-by-google-ai.vercel.app' }}
          PUBLISH_ID: ${{ github.event.client_payload.publish_id }}
        run: |
          if [ -n "$PUBLISH_ID" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              STATUS="published"
            else
              STATUS="failed"
            fi

            # cookie-status 단계와 같은 이유로 https를 강제한다: 이 호출이 http로 나가 308
            # 리다이렉트를 만나면 "Redirecting..."만 받고 상태 갱신을 놓쳐, 큐에 published/failed
            # 항목이 "publishing"으로 영구히 남아 대기열을 막는다 (2026-09-24/25 실사례).
            APP_URL="https://$(echo "$APP_URL" | sed -E 's#^https?://##; s#/+$##')"
            echo "Updating Vercel topic ($PUBLISH_ID) status to: $STATUS"
            HTTP_CODE=$(curl -sS -L -o /tmp/topic_status_resp.json -w "%{http_code}" \
              --retry 3 --retry-delay 3 --retry-all-errors \
              -X PUT "$APP_URL/api/admin/topics" \
              -H "Authorization: Bearer $ADMIN_PASSWORD" \
              -H "Content-Type: application/json" \
              -d "{\"id\": \"$PUBLISH_ID\", \"status\": \"$STATUS\"}") || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Topic status updated (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Warning: Failed to update topic status (HTTP $HTTP_CODE) — queue may be left stuck as 'publishing'"
              cat /tmp/topic_status_resp.json 2>/dev/null || true
            fi
          fi
