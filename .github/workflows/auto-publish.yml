name: Auto Blog Publish

on:
  repository_dispatch:
    types: [publish_post]

# Prevent concurrent runs
concurrency:
  group: auto-publish
  cancel-in-progress: false

env:
  LANG: ko_KR.UTF-8
  LC_ALL: C.UTF-8
  PYTHONIOENCODING: utf-8

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Node.js (for blog generation)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 3. Setup Python (for Tistory publishing)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager python-dotenv

      # 4. Install Chrome Dependencies and Xvfb
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libxss1 libasound2t64 libatk-bridge2.0-0t64 libgtk-3-0 libgbm1 libdrm2 xvfb

      # 5. Restore Tistory cookies
      - name: Restore cookies
        run: |
          mkdir -p ~/.tistory_login/cookies
          echo "${{ secrets.TISTORY_COOKIES_B64 }}" | base64 -d > ~/.tistory_login/cookies/default_cookies.pkl

      # 6. Generate blog post
      - name: Generate blog content
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_TOPIC: ${{ github.event.client_payload.topic }}
          PUBLISH_TEMPLATE: ${{ github.event.client_payload.template || 'review' }}
        run: |
          echo "Generating blog post for: $PUBLISH_TOPIC"
          npx tsx scripts/generate-content.ts "$PUBLISH_TOPIC" "$PUBLISH_TEMPLATE" > /tmp/blog_output.json
          echo "content_file=/tmp/blog_output.json" >> $GITHUB_OUTPUT
          cat /tmp/blog_output.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Title: {d.get(\"title\",\"?\")[:60]}')"

      # 7. Publish to Tistory
      - name: Publish to Tistory
        id: publish
        env:
          TISTORY_BLOG_URL: https://climate-insight.tistory.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          xvfb-run --auto-servernum python scripts/publish-to-tistory.py \
            --content-file /tmp/blog_output.json \
            --blog-url "$TISTORY_BLOG_URL" \
            --categories "카테고리 없음,ai 신기술 및 이슈,기후변화 이슈,정책과 제도,기후금융,국제협력,과학과 기술,탄소중립,기타"

      # 7.1 Debug Chromedriver on failure
      - name: Show Chromedriver Logs
        if: failure()
        run: cat /tmp/chromedriver.log || echo "No chromedriver log found"

      # 7.2 Report cookie status to Admin Dashboard
      - name: Report cookie status
        if: always()
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_URL: https://auto-blog-by-google-ai.vercel.app
        run: |
          if [ -f /tmp/publish_result.json ]; then
            ERROR=$(python3 -c "import json; r=json.load(open('/tmp/publish_result.json')); print(r.get('error',''))")
            SUCCESS=$(python3 -c "import json; r=json.load(open('/tmp/publish_result.json')); print(r.get('success', False))")

            if [ "$SUCCESS" = "True" ]; then
              STATUS="valid"
              ERROR_MSG=""
            elif echo "$ERROR" | grep -qiE "로그인|login|cookie|쿠키|로딩 실패|redirect"; then
              STATUS="expired"
              ERROR_MSG="$ERROR"
            else
              STATUS="valid"
              ERROR_MSG=""
            fi
          else
            STATUS="unknown"
            ERROR_MSG="publish_result.json not found"
          fi

          echo "Reporting cookie status: $STATUS"
          curl -s -X POST "$APP_URL/api/admin/cookie-status" \
            -H "Authorization: Bearer $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\", \"error\": \"$ERROR_MSG\"}" || echo "Warning: Failed to report cookie status"

      # 8. Send result email
      - name: Send notification email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ github.event.client_payload.recipientEmail || secrets.GMAIL_USER }}
        run: |
          npx tsx scripts/send-result-email.ts
